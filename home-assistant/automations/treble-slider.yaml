# Treble helper -> amp.
# Home Assistant automation for the Music Assistant Smart Dial. Explained in parts/06-home-assistant/README.md.
# Paste it into a new automation in YAML mode. Search this file for CHANGE.
id: '1775589113437'
alias: Treble Slider
description: When the bathroom amp treble slider changes, passes its new value to the bathroom amp treble script.
triggers:
- entity_id: input_number.your_room_amp_treble
  trigger: state
conditions: []
actions:
- data:
    value: '{{ trigger.to_state.state | int }}'
  action: script.your_room_amp_treble
mode: single
