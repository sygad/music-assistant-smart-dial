# Bass helper -> amp.
# Home Assistant automation for the Music Assistant Smart Dial. Explained in parts/06-home-assistant/README.md.
# Paste it into a new automation in YAML mode. Search this file for CHANGE.
id: '1775589066534'
alias: Bass Slider
description: When the bathroom amp bass slider changes, passes its new value to the bathroom amp bass script.
triggers:
- entity_id: input_number.your_room_amp_bass
  trigger: state
conditions: []
actions:
- data:
    value: '{{ trigger.to_state.state | int }}'
  action: script.your_room_amp_bass
mode: single
