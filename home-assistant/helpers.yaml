# The helpers the dial reads and writes. Explained in parts/06-home-assistant/README.md.
# Add them under these keys in configuration.yaml, or make the same ones in Settings > Devices & services > Helpers.
# The entity ids start with the dial's room, DIAL_ROOM in config/secrets.local (your_room here). Change your_room_ in every file, or set DIAL_ROOM=your_room.
input_number:
  your_room_amp_volume:
    name: Amp Volume
    min: 0
    max: 98
    step: 1
    mode: slider
    icon: mdi:volume-high
  your_room_amp_bass:
    name: Amp Bass
    min: -6
    max: 6
    step: 1
    mode: slider
    icon: mdi:music-clef-bass
  your_room_amp_treble:
    name: Amp Treble
    min: -6
    max: 6
    step: 1
    mode: slider
    icon: mdi:music-clef-treble
  your_room_amp_subwoofer:
    name: Amp Subwoofer
    min: -12
    max: 12
    step: 1
    mode: slider
    icon: mdi:speaker
input_boolean:
  your_room_music:
    name: Music
    icon: mdi:music
  your_room_dial_update:
    name: Dial Update
    icon: mdi:cloud-download
input_text:
  your_room_dial_firmware_url:
    name: Dial Firmware URL
    icon: mdi:link-variant
    min: 0
    max: 255
    mode: text
  # Where the amp and the streamer are. The dial reads these when it starts,
  # and restarts itself within a minute of either changing while it's awake.
  # Dial Player takes the name as Music Assistant shows it, or the player id.
  # Empty means use AMP_SERVER and MA_PLAYER from config/secrets.local.
  your_room_dial_amp_address:
    name: Dial Amp Address
    icon: mdi:amplifier
    min: 0
    max: 100
    mode: text
  your_room_dial_player:
    name: Dial Player
    icon: mdi:speaker-wireless
    min: 0
    max: 100
    mode: text
