<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Assistant Smart Dial</title>
<meta name="description" content="The story so far: from ceiling speakers and car subs in the bathroom to a round touchscreen dial that plays Music Assistant.">
<!-- Built by tools/build_page.py from README.md. Edit the README, then rebuild. -->
<style>
:root {
  --bg: #ffffff;
  --text: #1f2328;
  --muted: #59636e;
  --line: #d1d9e0;
  --soft: #f6f8fa;
  --accent: #0969da;
  --num: #0969da;
  --shadow: 0 1px 3px rgba(31, 35, 40, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --text: #e6edf3;
    --muted: #9198a1;
    --line: #30363d;
    --soft: #161b22;
    --accent: #4493f8;
    --num: #4493f8;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --text: #e6edf3; --muted: #9198a1; --line: #30363d;
  --soft: #161b22; --accent: #4493f8; --num: #4493f8; --shadow: none;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}
.page { max-width: 880px; margin: 0 auto; padding: 56px 24px 96px; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }

h1 { font-size: 40px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 20px; }
h2 {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px;
  font-size: 28px; line-height: 1.25; letter-spacing: -.01em;
  margin: 104px 0 20px; padding-top: 28px; border-top: 1px solid var(--line);
}
h2 .num { color: var(--num); font-variant-numeric: tabular-nums; }
h2 .when { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
h3 { font-size: 21px; margin: 56px 0 12px; }
p, ul, ol { margin: 0 0 18px; }
li { margin: 4px 0; }
hr { display: none; }

blockquote {
  margin: 24px 0; padding: 14px 18px;
  background: var(--soft); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
}
blockquote p { margin: 0; }

/* The story at a glance */
ul.timeline { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
ul.timeline li {
  display: grid; grid-template-columns: 132px 1fr; gap: 16px;
  position: relative; padding: 7px 0 7px 20px; margin: 0;
}
ul.timeline li::before {
  content: ""; position: absolute; left: -6px; top: 16px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
}
ul.timeline .date { font-weight: 600; white-space: nowrap; }

/* Images */
figure { margin: 28px 0 36px; }
figure a.zoom { display: inline-block; max-width: 100%; border-radius: 10px; cursor: zoom-in; }
figure img {
  display: block; max-width: 100%; height: auto;
  border-radius: 10px; box-shadow: var(--shadow);
}
figure a.zoom:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
figcaption { margin-top: 10px; font-size: 15px; line-height: 1.5; color: var(--muted); }
img.transparent { box-shadow: none; }

footer { margin-top: 96px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }

/* Pop-up viewer */
.lb {
  position: fixed; inset: 0; z-index: 10;
  display: grid; grid-template-rows: 1fr auto;
  background: #05080d; color: #e6edf3;
}
.lb[hidden] { display: none; }
.lb-stage {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 56px 72px 12px;
}
.lb-img {
  max-width: 100%; max-height: 100%; object-fit: contain;
  border-radius: 6px; user-select: none; -webkit-user-drag: none;
}
.lb-img.svg { width: 100%; height: 100%; }
.lb.can-zoom .lb-img { cursor: zoom-in; }
.lb.zoomed .lb-stage { overflow: auto; display: block; padding: 56px 16px 12px; }
.lb.zoomed .lb-img { max-width: none; max-height: none; cursor: zoom-out; margin: 0 auto; }
.lb-bar {
  display: flex; gap: 16px; align-items: baseline; justify-content: space-between;
  padding: 12px 24px 20px; font-size: 15px; line-height: 1.45;
}
.lb-cap { color: #e6edf3; max-width: 70ch; }
.lb-meta { color: #9198a1; white-space: nowrap; }
.lb button {
  position: absolute; z-index: 1;
  display: grid; place-items: center;
  width: 48px; height: 48px; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .1); color: #fff; cursor: pointer;
}
.lb button:hover { background: rgba(255, 255, 255, .2); }
.lb button:focus-visible { outline: 3px solid #4493f8; outline-offset: 2px; }
.lb button svg { width: 24px; height: 24px; }
.lb-close { top: 12px; right: 12px; }
.lb-prev { left: 12px; top: calc(50% - 24px); }
.lb-next { right: 12px; top: calc(50% - 24px); }
.lb.zoomed .lb-prev, .lb.zoomed .lb-next { display: none; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .page { padding: 32px 16px 72px; }
  h1 { font-size: 30px; }
  h2 { font-size: 23px; margin-top: 80px; }
  ul.timeline li { grid-template-columns: 1fr; gap: 0; }
  .lb-stage { padding: 56px 8px 8px; }
  .lb-bar { flex-direction: column; gap: 4px; padding: 10px 16px 16px; }
}
</style>
</head>
<body>
<main class="page">
<!-- CONTENT -->
<footer>
  The project on GitHub: <a href="https://github.com/sygad/music-assistant-smart-dial-v2">sygad/music-assistant-smart-dial-v2</a>
</footer>
</main>

<div class="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-stage"><img class="lb-img" alt=""></div>
  <div class="lb-bar"><span class="lb-cap"></span><span class="lb-meta"></span></div>
  <button class="lb-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-prev" type="button" aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb-next" type="button" aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
(function () {
  "use strict";
  var links = Array.prototype.slice.call(document.querySelectorAll("a.zoom"));
  var lb = document.querySelector(".lb");
  var stage = lb.querySelector(".lb-stage");
  var img = lb.querySelector(".lb-img");
  var cap = lb.querySelector(".lb-cap");
  var meta = lb.querySelector(".lb-meta");
  var index = -1, opener = null, pushed = false;
  var touch = window.matchMedia("(pointer: coarse)").matches;

  function caption(a) {
    var fc = a.closest("figure") && a.closest("figure").querySelector("figcaption");
    return fc ? fc.textContent : (a.querySelector("img").alt || "");
  }

  function show(i) {
    index = (i + links.length) % links.length;
    var a = links[index];
    lb.classList.remove("zoomed", "can-zoom");
    var isSvg = /\.svg$/i.test(a.getAttribute("href"));
    img.classList.toggle("svg", isSvg);
    // the page's own copy shows at once; the full-size file replaces it when it arrives
    img.src = a.querySelector("img").currentSrc || a.querySelector("img").src;
    img.alt = a.querySelector("img").alt;
    var full = new Image();
    full.onload = function () { if (links[index] === a) { img.src = full.src; checkZoom(); } };
    full.src = a.getAttribute("href");
    cap.textContent = caption(a);
    meta.textContent = (index + 1) + " / " + links.length;
  }

  // zoom only helps when the full image is bigger than the space it's fitted into
  function checkZoom() {
    var bigger = !img.classList.contains("svg") &&
      (img.naturalWidth > img.clientWidth * 1.15 || img.naturalHeight > img.clientHeight * 1.15);
    lb.classList.toggle("can-zoom", bigger);
    meta.textContent = (index + 1) + " / " + links.length + (bigger ? " · " + (touch ? "tap" : "click") + " the image to zoom" : "");
  }

  function open(i) {
    opener = document.activeElement;
    lb.hidden = false;
    document.documentElement.style.overflow = "hidden";
    show(i);
    // so a phone's back gesture closes the pop-up instead of leaving the page
    history.pushState({ lb: true }, "");
    pushed = true;
    lb.querySelector(".lb-close").focus();
  }

  function close(fromHistory) {
    if (lb.hidden) return;
    lb.hidden = true;
    lb.classList.remove("zoomed");
    document.documentElement.style.overflow = "";
    img.removeAttribute("src");
    if (pushed && !fromHistory) history.back();
    pushed = false;
    if (opener) opener.focus({ preventScroll: true });
  }

  function toggleZoom(e) {
    if (!lb.classList.contains("can-zoom") && !lb.classList.contains("zoomed")) return;
    var r = img.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    lb.classList.toggle("zoomed");
    if (lb.classList.contains("zoomed")) {
      // keep the spot that was clicked under the pointer
      stage.scrollLeft = fx * img.offsetWidth - stage.clientWidth / 2;
      stage.scrollTop = fy * img.offsetHeight - stage.clientHeight / 2;
    }
  }

  links.forEach(function (a, i) {
    a.addEventListener("click", function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      open(i);
    });
  });

  lb.querySelector(".lb-close").addEventListener("click", function () { close(false); });
  lb.querySelector(".lb-prev").addEventListener("click", function () { show(index - 1); });
  lb.querySelector(".lb-next").addEventListener("click", function () { show(index + 1); });
  img.addEventListener("click", function (e) { e.stopPropagation(); toggleZoom(e); });
  img.addEventListener("load", function () { if (!lb.hidden) checkZoom(); });
  stage.addEventListener("click", function (e) { if (e.target === stage) close(false); });
  window.addEventListener("resize", function () { if (!lb.hidden && !lb.classList.contains("zoomed")) checkZoom(); });
  window.addEventListener("popstate", function () { pushed = false; close(true); });

  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") { if (lb.classList.contains("zoomed")) lb.classList.remove("zoomed"); else close(false); }
    else if (e.key === "ArrowLeft" && !lb.classList.contains("zoomed")) show(index - 1);
    else if (e.key === "ArrowRight" && !lb.classList.contains("zoomed")) show(index + 1);
    else if (e.key === "Tab") {
      // keep focus inside the pop-up
      var f = Array.prototype.slice.call(lb.querySelectorAll("button"));
      var k = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });

  // swipe left and right on a phone
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) {
    if (lb.classList.contains("zoomed") || e.touches.length !== 1) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(index + (dx < 0 ? 1 : -1));
    sx = null;
  });
})();
</script>
</body>
</html>
